<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhabhi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --room:#1A1226; --room-lit:#3A2A55;
  --wood:#5A3A1E;
  --felt:#2C5E4A; --felt-dark:#1C4433;
  --brass:#C8963E; --brass-dim:#8A6628;
  --marigold:#E8873A; --bone:#F2E9DA; --bone-dim:#CFC2AE;
  --ink:#1C1526; --red:#C03B2B; --leaf:#4E9A6B;
  --line:rgba(200,150,62,.28);
  --card-w:clamp(48px,9.5vw,76px);
  --tcard:clamp(30px,5.2vw,44px);
  --tilt:56deg;
  --font-d:"Baloo Bhaijaan 2","Trebuchet MS",sans-serif;
  --font-b:"Karla","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(120% 70% at 50% 0%, var(--room-lit) 0%, rgba(58,42,85,0) 62%), var(--room);
  color:var(--bone);font-family:var(--font-b);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--marigold);outline-offset:2px;border-radius:4px}
.hidden{display:none !important}

.wrap{max-width:1060px;margin:0 auto;padding:14px 14px 24px;min-height:100%;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--font-d);font-weight:800;font-size:clamp(24px,5vw,34px);line-height:1}
.brand span{color:var(--brass)}
.tag{color:var(--bone-dim);font-size:13px}
.tbtn{border:1px solid var(--line);padding:6px 12px;border-radius:999px;color:var(--bone-dim);font-size:13px}
.tbtn:hover{color:var(--bone);border-color:var(--brass)}

.panel{border:1px solid var(--line);border-radius:16px;padding:22px;background:linear-gradient(180deg,#241A34,var(--room))}
.panel h2{font-family:var(--font-d);font-weight:700;font-size:20px;margin-bottom:4px}
.panel p{color:var(--bone-dim);max-width:60ch;margin-bottom:16px}
label.f{display:block;color:var(--bone-dim);font-size:13px;font-weight:600;margin-bottom:5px}
input[type=text]{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--bone);font:inherit;width:100%;max-width:240px}
#code{text-transform:uppercase;letter-spacing:.22em;font-weight:700;max-width:170px}
.go{background:var(--marigold);color:var(--ink);font-weight:700;padding:10px 24px;border-radius:999px}
.go:hover:not(:disabled){background:var(--brass)}
.ghost{border:1px solid var(--line);padding:9px 20px;border-radius:999px;color:var(--bone-dim);font-weight:600}
.ghost:hover:not(:disabled){color:var(--bone);border-color:var(--brass)}
.split{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-end}
.or{color:var(--bone-dim);font-size:13px;margin:18px 0 14px;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";height:1px;flex:1;background:var(--line)}
.err{color:var(--marigold);font-size:13.5px;font-weight:600;min-height:20px;margin-top:10px}
.codebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.codebig{font-family:var(--font-d);font-weight:800;font-size:clamp(38px,9vw,60px);letter-spacing:.12em;color:var(--brass);line-height:1}
.roster{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.roster div{display:flex;align-items:center;gap:8px;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:var(--leaf);flex:none}
.dot.off{background:var(--brass-dim)}
.roster .meta{color:var(--bone-dim);font-weight:400;font-size:13px}

/* ================= the room ================= */
.room{position:relative;perspective:1100px;perspective-origin:50% 26%;padding:10px 0 4px}
.plane{
  position:relative;width:100%;
  aspect-ratio:1.5 / 1;
  max-height:min(52vh,430px);
  margin:0 auto;
  transform:rotateX(var(--tilt));
  transform-style:preserve-3d;
}
.felt{
  position:absolute;inset:0;border-radius:50%;
  background:
    radial-gradient(60% 60% at 50% 40%, rgba(255,255,255,.07), rgba(0,0,0,0) 70%),
    radial-gradient(90% 90% at 50% 50%, var(--felt) 0%, var(--felt-dark) 100%);
  border:clamp(8px,1.6vw,15px) solid var(--wood);
  box-shadow:0 0 0 2px rgba(0,0,0,.45), inset 0 0 40px rgba(0,0,0,.55), 0 30px 60px rgba(0,0,0,.55);
}
.felt::after{content:"";position:absolute;inset:6%;border-radius:50%;border:1px solid rgba(200,150,62,.16)}

.seat3d{position:absolute;transform-style:preserve-3d}
.stand{
  position:absolute;left:0;top:0;
  transform:translate(-50%,-100%) rotateX(calc(-1 * var(--tilt)));
  transform-origin:50% 100%;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:filter .25s;
}
.stand svg{display:block;width:clamp(34px,6vw,54px);height:auto}
.body,.head{fill:#0B0812}
.rim{fill:none;stroke:rgba(200,150,62,.45);stroke-width:2}
.plate{
  background:rgba(12,8,20,.82);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;white-space:nowrap;font-family:var(--font-d);font-weight:700;
  font-size:clamp(11px,1.7vw,14px);line-height:1.35;display:flex;align-items:center;gap:7px;
}
.plate .n{color:var(--bone)}
.plate .c{color:var(--bone-dim);font-family:var(--font-b);font-weight:600;font-size:.85em}
.plate .place{color:var(--leaf);font-family:var(--font-b);font-weight:700;font-size:.8em}
.plate .away{color:var(--marigold);font-family:var(--font-b);font-weight:700;font-size:.8em}
.seat3d.me .plate .n{color:var(--brass)}
.seat3d.turn .plate{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass),0 0 16px rgba(200,150,62,.35)}
.seat3d.turn .stand{filter:drop-shadow(0 0 10px rgba(200,150,62,.55))}
.seat3d.eat .plate{border-color:var(--marigold);box-shadow:0 0 22px rgba(232,135,58,.6)}
.seat3d.eat .stand{filter:drop-shadow(0 0 14px rgba(232,135,58,.85))}
.seat3d.out .stand{filter:grayscale(1) opacity(.42)}

.tcard{
  position:absolute;width:var(--tcard);height:calc(var(--tcard)*1.42);
  margin-left:calc(var(--tcard)/-2);margin-top:calc(var(--tcard)*-0.71);
  background:linear-gradient(170deg,#FFFBF2,#E7DAC3);
  border-radius:5px;border:1px solid rgba(0,0,0,.4);color:var(--ink);
  box-shadow:0 6px 14px rgba(0,0,0,.55);font-weight:700;
  display:flex;align-items:center;justify-content:center;
  transition:transform .40s cubic-bezier(.2,.75,.3,1), opacity .35s;
}
.tcard.red{color:var(--red)}
.tcard b{font-size:calc(var(--tcard)*.42);line-height:1}
.tcard.high{box-shadow:0 0 0 2px var(--brass),0 6px 14px rgba(0,0,0,.55)}
.tcard.cut{box-shadow:0 0 0 2px var(--marigold),0 6px 14px rgba(0,0,0,.55)}
.dealcard{
  position:absolute;left:50%;top:50%;
  width:var(--tcard);height:calc(var(--tcard)*1.42);
  margin-left:calc(var(--tcard)/-2);margin-top:calc(var(--tcard)*-0.71);
  border-radius:5px;border:1px solid rgba(0,0,0,.45);
  background:repeating-linear-gradient(45deg,#8A6034 0 4px,#5A3A1E 4px 8px);
  box-shadow:0 8px 16px rgba(0,0,0,.5);
  transition:transform .46s cubic-bezier(.2,.75,.3,1), opacity .28s;
}
.nudge{
  border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  color:var(--bone-dim);font-family:var(--font-b);font-weight:600;font-size:.78em;
}
.nudge:hover:not(:disabled){color:var(--marigold);border-color:var(--marigold)}
.turnbar.poked{animation:poke .5s ease-in-out 2}
@keyframes poke{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
/* lies flat ON the felt rather than standing up through it */
.tablenote{
  position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
  color:rgba(242,233,218,.5);font-size:13px;font-style:italic;white-space:nowrap;
  letter-spacing:.06em;
}
.turnbar{
  display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;
  min-height:32px;font-family:var(--font-d);font-weight:700;
  font-size:clamp(14px,2.4vw,19px);line-height:1.2;text-align:center;
}
.turnbar .who{color:var(--brass)}
.turnbar.mine .who{color:var(--marigold)}
.turnbar .sub{font-family:var(--font-b);font-weight:600;font-size:.8em;color:var(--bone-dim)}
.turnbar .pip{width:9px;height:9px;border-radius:50%;background:currentColor;flex:none;animation:blip 1.5s ease-in-out infinite}
@keyframes blip{0%,100%{opacity:.2}50%{opacity:1}}

/* ================= your hand ================= */
.mine-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.mine-head .nm{font-family:var(--font-d);font-weight:700;font-size:17px}
.mine-head .hint{color:var(--marigold);font-size:13.5px;font-weight:600;text-align:right}
.clock{height:3px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;margin-top:6px}
.clock i{display:block;height:100%;background:var(--marigold);width:0;transition:width .3s linear}
.hand{display:flex;overflow-x:auto;padding:20px 2px 8px;scrollbar-width:thin}
.card{
  width:var(--card-w);height:calc(var(--card-w)*1.42);flex:none;
  background:linear-gradient(170deg,#FFFBF2,#E7DAC3);border-radius:7px;border:1px solid rgba(0,0,0,.35);
  color:var(--ink);position:relative;box-shadow:0 3px 8px rgba(0,0,0,.4);
  display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-weight:700;
}
.card.red{color:var(--red)}
.card .r{font-size:calc(var(--card-w)*.30);line-height:1}
.card .p{font-size:calc(var(--card-w)*.36);line-height:1;align-self:flex-end;transform:rotate(180deg)}
.card .mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--card-w)*.42);opacity:.75}
.hand .card{margin-right:calc(var(--card-w) * -0.34);transition:transform .16s,filter .16s}
.hand .card:last-child{margin-right:0}
.hand .card.ok{cursor:pointer}
.hand .card.ok:hover,.hand .card.ok:focus-visible{transform:translateY(-14px);z-index:5}
.hand .card.no{filter:brightness(.74) saturate(.8);cursor:not-allowed}

.feed{border-top:1px solid var(--line);padding-top:8px;height:92px;overflow-y:auto;font-size:13.5px;color:var(--bone-dim);scrollbar-width:thin}
.feed .chat{color:var(--bone)}
.feed .chat b{color:var(--brass);font-weight:700}
.sayrow{display:flex;gap:8px;margin-top:8px}
.sayrow input{flex:1;max-width:none}

.banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:50}
.banner span{font-family:var(--font-d);font-weight:800;font-size:clamp(40px,11vw,96px);color:var(--marigold);text-shadow:0 6px 30px rgba(0,0,0,.7);animation:pop 1.4s ease-out forwards}
@keyframes pop{0%{transform:scale(.7);opacity:0}18%{transform:scale(1.06);opacity:1}80%{opacity:1}100%{transform:scale(1.02);opacity:0}}

.over{position:fixed;inset:0;background:rgba(14,9,22,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.over .box{border:1px solid var(--line);border-radius:18px;padding:26px 28px;background:#241A34;max-width:420px;width:100%;text-align:center}
.over h2{font-family:var(--font-d);font-weight:800;font-size:26px;margin-bottom:6px}
.over .who2{color:var(--marigold);font-family:var(--font-d);font-size:32px;font-weight:800;line-height:1.1;margin-bottom:8px}
.over ol{text-align:left;margin:14px 0;padding-left:22px;color:var(--bone-dim)}
.over ol li b{color:var(--bone)}
.over .tally{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:13.5px;color:var(--bone-dim);text-align:left}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
@media (max-width:620px){
  :root{--tilt:48deg}
  .plane{aspect-ratio:1.22 / 1;max-height:44vh;width:84%}
  .plate{padding:2px 7px;gap:5px}
  .feed{height:74px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <div class="brand">Bhabhi<span>.</span></div>
      <div class="tag">Dump your cards. Don't be last.</div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="tbtn" id="muteBtn" title="Sound">Sound on</button>
      <button class="tbtn" id="rulesBtn">Rules</button>
      <button class="tbtn hidden" id="leaveBtn">Leave</button>
    </div>
  </div>

  <section class="panel" id="enter">
    <h2>Start a table or join one</h2>
    <p>Open a table, then send the link to your friends. Three players minimum — bots can fill the empty seats.</p>
    <div><label class="f" for="nick">Your name</label>
      <input type="text" id="nick" maxlength="12" placeholder="Name" autocomplete="nickname"></div>
    <div style="margin-top:16px"><button class="go" id="createBtn">Open a table</button></div>
    <div class="or">or</div>
    <div class="split">
      <div><label class="f" for="code">Table code</label>
        <input type="text" id="code" maxlength="4" placeholder="XXXX" autocomplete="off" spellcheck="false"></div>
      <button class="ghost" id="joinBtn">Join</button>
    </div>
    <div class="err" id="enterErr"></div>
  </section>

  <section class="panel hidden" id="lobby">
    <h2>Waiting for players</h2>
    <div class="codebox">
      <div class="codebig" id="lobbyCode">----</div>
      <button class="ghost" id="copyBtn">Copy invite link</button>
    </div>
    <div class="roster" id="roster"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="ghost hostonly" id="addBotBtn">Add a bot</button>
      <button class="ghost hostonly" id="rmBotBtn">Remove bot</button>
      <button class="go hostonly" id="startBtn">Deal</button>
    </div>
    <div class="err" id="lobbyErr"></div>
    <div class="feed" id="lobbyFeed" style="margin-top:16px"></div>
    <div class="sayrow">
      <input type="text" id="lobbySay" maxlength="140" placeholder="Say something">
      <button class="ghost" id="lobbySayBtn">Send</button>
    </div>
  </section>

  <section class="hidden" id="game" style="display:flex;flex-direction:column;gap:10px;flex:1">
    <div class="turnbar" id="turnbar"></div>
    <div class="room"><div class="plane" id="plane"><div class="felt"></div></div></div>
    <div>
      <div class="mine-head">
        <div class="nm" id="myLabel">You</div>
        <div class="hint" id="hint"></div>
      </div>
      <div class="clock"><i id="clockBar"></i></div>
      <div class="hand" id="hand"></div>
    </div>
    <div class="feed" id="feed"></div>
    <div class="sayrow">
      <input type="text" id="say" maxlength="140" placeholder="Say something">
      <button class="ghost" id="sayBtn">Send</button>
    </div>
  </section>
</div>

<div class="banner hidden" id="banner"><span id="bannerTxt"></span></div>

<div class="over hidden" id="over">
  <div class="box">
    <h2 id="overTitle"></h2>
    <div class="who2" id="overWho"></div>
    <div id="overSub" style="color:var(--bone-dim)"></div>
    <ol id="overList"></ol>
    <div class="tally" id="tallyBox"></div>
    <button class="go" id="againBtn" style="margin-top:16px">Close</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
(function(){
"use strict";

var GLYPH={S:"\u2660",H:"\u2665",D:"\u2666",C:"\u2663"};
var LABEL={11:"J",12:"Q",13:"K",14:"A"};
var SUITNAME={S:"spades",H:"hearts",D:"diamonds",C:"clubs"};
var REDS={H:1,D:1};
var ORD=["1st","2nd","3rd","4th","5th","6th"];
var rl=function(r){return LABEL[r]||String(r)};
var $=function(id){return document.getElementById(id)};

/* ---- sound, synthesized in the browser so there are no files to host ---- */
var Snd=(function(){
  var ctx=null,on=true;
  try{ on=localStorage.getItem("bhabhi.mute")!=="1"; }catch(e){}
  function ac(){
    if(!ctx){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; try{ctx=new C()}catch(e){return null} }
    if(ctx.state==="suspended"){ try{ctx.resume()}catch(e){} }
    return ctx;
  }
  function noise(dur,f0,f1,gain){
    var c=ac(); if(!c||!on) return;
    var len=Math.max(1,Math.floor(c.sampleRate*dur));
    var buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
    var src=c.createBufferSource(); src.buffer=buf;
    var flt=c.createBiquadFilter(); flt.type="bandpass"; flt.Q.value=1.2;
    flt.frequency.setValueAtTime(f0,c.currentTime);
    flt.frequency.exponentialRampToValueAtTime(f1,c.currentTime+dur);
    var g=c.createGain(); g.gain.value=gain;
    src.connect(flt); flt.connect(g); g.connect(c.destination); src.start();
  }
  function tone(freq,dur,type,gain,slideTo){
    var c=ac(); if(!c||!on) return;
    var o=c.createOscillator(),g=c.createGain();
    o.type=type||"sine";
    o.frequency.setValueAtTime(freq,c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+dur);
    g.gain.setValueAtTime(0.0001,c.currentTime);
    g.gain.linearRampToValueAtTime(gain,c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur+0.03);
  }
  return {
    flick:function(){ noise(0.12,1500,4400,0.15); },
    deal:function(){ noise(0.09,1200,3800,0.11); },
    take:function(){ tone(430,0.22,"sine",0.09,680); },
    thulla:function(){ tone(160,0.45,"sawtooth",0.11,58); setTimeout(function(){noise(0.3,280,900,0.15)},70); },
    turn:function(){ tone(880,0.15,"sine",0.08); setTimeout(function(){tone(1320,0.2,"sine",0.06)},110); },
    nudge:function(){ tone(1046,0.11,"square",0.06); setTimeout(function(){tone(1046,0.11,"square",0.06)},170); },
    out:function(){ tone(660,0.15,"sine",0.08); setTimeout(function(){tone(990,0.26,"sine",0.07)},120); },
    on:function(){ return on; },
    toggle:function(){ on=!on; try{localStorage.setItem("bhabhi.mute",on?"0":"1")}catch(e){} if(on){ac();tone(760,0.14,"sine",0.08);} return on; },
    wake:ac
  };
})();
document.addEventListener("click",function(){ Snd.wake(); },{once:true});
$("muteBtn").addEventListener("click",function(){
  $("muteBtn").textContent = Snd.toggle()?"Sound on":"Sound off";
});
$("muteBtn").textContent = Snd.on()?"Sound on":"Sound off";

var socket=io();
var S=null,myCode=null,myToken=null;
var shownEvent=null,overShown=false,rulesOpen=false;
var onTable={},flyTimer=null,prevTurn=null,prevPhase=null,prevOut=0;

try{
  myToken=localStorage.getItem("bhabhi.token");
  if(!myToken){ myToken=(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()); localStorage.setItem("bhabhi.token",myToken); }
  var sn=localStorage.getItem("bhabhi.name"); if(sn) $("nick").value=sn;
}catch(e){ myToken=String(Math.random()).slice(2)+Date.now(); }

var urlCode=new URLSearchParams(location.search).get("r");
if(urlCode) $("code").value=urlCode.toUpperCase();

function nick(){
  var n=($("nick").value||"").trim().slice(0,12);
  try{ if(n) localStorage.setItem("bhabhi.name",n); }catch(e){}
  return n;
}
function err(id,m){ $(id).textContent=m; setTimeout(function(){ if($(id).textContent===m) $(id).textContent=""; },4000); }

$("createBtn").addEventListener("click",function(){
  if(!nick()) return err("enterErr","Pick a name first.");
  socket.emit("create",{name:nick(),token:myToken});
});
function doJoin(){
  var c=($("code").value||"").trim().toUpperCase();
  if(!nick()) return err("enterErr","Pick a name first.");
  if(c.length!==4) return err("enterErr","Table codes are four characters.");
  socket.emit("join",{code:c,name:nick(),token:myToken});
}
$("joinBtn").addEventListener("click",doJoin);
$("code").addEventListener("keydown",function(e){if(e.key==="Enter")doJoin()});
$("nick").addEventListener("keydown",function(e){if(e.key==="Enter")doJoin()});
$("leaveBtn").addEventListener("click",function(){location.href=location.pathname});
$("copyBtn").addEventListener("click",function(){
  var link=location.origin+location.pathname+"?r="+myCode;
  var done=function(){$("copyBtn").textContent="Link copied";setTimeout(function(){$("copyBtn").textContent="Copy invite link"},1800)};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done,function(){prompt("Copy this link",link)});
  else prompt("Copy this link",link);
});
$("addBotBtn").addEventListener("click",function(){socket.emit("addBot")});
$("rmBotBtn").addEventListener("click",function(){socket.emit("removeBot")});
$("startBtn").addEventListener("click",function(){socket.emit("start")});
function wireSay(i,b){
  var send=function(){var t=$(i).value.trim();if(!t)return;socket.emit("chat",{text:t});$(i).value=""};
  $(b).addEventListener("click",send);
  $(i).addEventListener("keydown",function(e){if(e.key==="Enter")send()});
}
wireSay("say","sayBtn"); wireSay("lobbySay","lobbySayBtn");

socket.on("joined",function(d){
  myCode=d.code; myToken=d.token;
  try{localStorage.setItem("bhabhi.token",myToken)}catch(e){}
  if(history.replaceState) history.replaceState(null,"",location.pathname+"?r="+d.code);
  $("leaveBtn").classList.remove("hidden");
});
socket.on("nope",function(m){ err(myCode?"lobbyErr":"enterErr",m); });
socket.on("state",function(st){ S=st; render(); });
socket.on("nudged",function(d){
  Snd.nudge();
  var tb=$("turnbar"); tb.classList.add("poked");
  setTimeout(function(){tb.classList.remove("poked")},1100);
});
$("turnbar").addEventListener("click",function(e){
  if(e.target&&e.target.id==="nudgeBtn"){ socket.emit("nudge"); e.target.disabled=true;
    setTimeout(function(){ if(e.target) e.target.disabled=false; },8000); }
});
socket.on("disconnect",function(){ $("hint").textContent="Reconnecting\u2026"; });
socket.on("connect",function(){ if(myCode) socket.emit("join",{code:myCode,name:nick()||"Player",token:myToken}); });

/* ---- seating geometry ----
   Seat 0 in the layout is always YOU, nearest the camera.
   Everyone else runs clockwise around the ellipse.        */
function seatAngle(i,n,you){
  var rel=(i-you+n)%n;
  return (rel/n)*Math.PI*2;   // 0 rad = bottom of the table
}
var FIG_RX=45, FIG_RY=43;     // where the people sit
var CARD_RX=23, CARD_RY=21;   // where their played card lands

function figureSVG(){
  return '<svg viewBox="0 0 60 66" aria-hidden="true">'+
    '<ellipse class="body" cx="30" cy="61" rx="26" ry="9"/>'+
    '<path class="body" d="M30 26c-11 0-19 7-21 18-1 5 1 8 5 8h32c4 0 6-3 5-8-2-11-10-18-21-18z"/>'+
    '<circle class="head" cx="30" cy="15" r="13"/>'+
    '<circle class="rim" cx="30" cy="15" r="13"/></svg>';
}

function render(){
  if(!S) return;
  $("enter").classList.add("hidden");
  $("lobby").classList.toggle("hidden",S.phase!=="lobby");
  $("game").classList.toggle("hidden",S.phase==="lobby");
  if(S.phase==="lobby"){ prevPhase="lobby"; renderLobby(); drawFeed("lobbyFeed"); return; }
  if(prevPhase!=="playing"&&S.phase==="playing"&&S.firstTrick&&!S.trick.length){
    onTable={}; prevOut=0; setTimeout(dealAnimation,60);
  }
  renderTurnBar(); renderTable(); renderHand(); drawFeed("feed");
  if(S.turn===S.you&&prevTurn!==S.you&&!S.resolving&&!S.over) Snd.turn();
  prevTurn=S.turn; prevPhase=S.phase;
}

function renderLobby(){
  $("lobbyCode").textContent=S.code;
  var r=$("roster"); r.innerHTML="";
  S.players.forEach(function(p){
    var tags=[]; if(p.bot)tags.push("bot"); if(p.seat===S.you)tags.push("you");
    var d=document.createElement("div");
    d.innerHTML='<span class="dot'+(p.connected?"":" off")+'"></span><span>'+esc(p.name)+'</span>'+
      (tags.length?'<span class="meta">'+tags.join(" \u00b7 ")+'</span>':"");
    r.appendChild(d);
  });
  var host=!!S.isHost;
  document.querySelectorAll(".hostonly").forEach(function(b){b.classList.toggle("hidden",!host)});
  $("startBtn").disabled=S.players.length<S.minSeats;
  $("addBotBtn").disabled=S.players.length>=S.maxSeats;
  $("rmBotBtn").disabled=!S.players.some(function(p){return p.bot});
  $("lobby").querySelector("h2").textContent =
    S.players.length<S.minSeats ? ("Waiting for players \u2014 need "+(S.minSeats-S.players.length)+" more")
    : (host?"Ready when you are":"Waiting for the host to deal");
}

function planeSize(){ var p=$("plane"); return {W:p.clientWidth||600,H:p.clientHeight||400}; }
function cardRadius(mine){ return {rx:mine?CARD_RX*0.5:CARD_RX, ry:mine?CARD_RY*0.45:CARD_RY}; }

/* a newly played card slides in from its owner's seat */
function flyIn(el,a,mine,rot){
  var d=planeSize(), r=cardRadius(mine);
  var dx=((FIG_RX-r.rx)*Math.sin(a)/100)*d.W;
  var dy=((FIG_RY-r.ry)*Math.cos(a)/100)*d.H;
  el.style.opacity="0";
  el.style.transform="translate("+dx.toFixed(1)+"px,"+dy.toFixed(1)+"px) rotate("+rot.toFixed(1)+"deg) scale(.82)";
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.opacity="1";
    el.style.transform="rotate("+rot.toFixed(1)+"deg)";
  });});
}

/* when a trick ends: the pile flies to whoever eats it, or shrinks away */
function flyOut(ev){
  var plane=$("plane"), d=planeSize();
  var nn=S.seats.length, you=(S.you==null?0:S.you);
  var toA = ev.type==="cut" ? seatAngle(ev.eater,nn,you) : null;
  Array.prototype.forEach.call(plane.querySelectorAll(".tcard"),function(el,i){
    var seat=+el.dataset.seat, mine=(seat===S.you), a=seatAngle(seat,nn,you);
    var r=cardRadius(mine), cx=r.rx*Math.sin(a), cy=r.ry*Math.cos(a), tx,ty,sc;
    if(toA!==null){
      tx=((FIG_RX*0.88*Math.sin(toA))-cx)/100*d.W;
      ty=((FIG_RY*0.88*Math.cos(toA))-cy)/100*d.H; sc=.45;
    } else { tx=(0-cx)/100*d.W; ty=(0-cy)/100*d.H; sc=.22; }
    setTimeout(function(){
      el.style.transition="transform .6s cubic-bezier(.4,0,.6,1), opacity .6s";
      el.style.transform="translate("+tx.toFixed(1)+"px,"+ty.toFixed(1)+"px) scale("+sc+")";
      el.style.opacity="0";
    }, i*75);
  });
}

/* cards fanning out to every seat at the start of a round */
function dealAnimation(){
  var plane=$("plane"), d=planeSize();
  var nn=S.seats.length, you=(S.you==null?0:S.you), rounds=3, step=85;
  for(var k=0;k<rounds;k++){
    S.seats.forEach(function(s,idx){
      var a=seatAngle(s.seat,nn,you);
      var tx=(FIG_RX*0.80*Math.sin(a)/100)*d.W, ty=(FIG_RY*0.80*Math.cos(a)/100)*d.H;
      var el=document.createElement("div");
      el.className="dealcard"; el.style.opacity="0";
      plane.appendChild(el);
      var delay=(k*nn+idx)*step;
      setTimeout(function(){
        Snd.deal();
        el.style.opacity="1";
        el.style.transform="translate("+tx.toFixed(1)+"px,"+ty.toFixed(1)+"px) rotate("+(Math.sin(a)*24).toFixed(1)+"deg)";
        setTimeout(function(){ el.style.opacity="0"; },420);
        setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); },780);
      },delay);
    });
  }
}

function renderTable(){
  var plane=$("plane");
  Array.prototype.slice.call(plane.children).forEach(function(c){
    if(!c.classList.contains("felt")) plane.removeChild(c);
  });

  var n=S.seats.length, you=(S.you==null?0:S.you);

  S.seats.forEach(function(s){
    var a=seatAngle(s.seat,n,you);
    var el=document.createElement("div");
    el.className="seat3d"+(s.seat===S.you?" me":"")+(S.turn===s.seat?" turn":"")+(s.count===0?" out":"");
    el.dataset.seat=s.seat;
    el.style.left=(50+FIG_RX*Math.sin(a))+"%";
    el.style.top=(50+FIG_RY*Math.cos(a))+"%";
    var p=(S.players||[]).find(function(x){return x.seat===s.seat})||{};
    var extra = s.place>=0 ? '<span class="place">'+ORD[s.place]+'</span>'
              : (p.connected===false?'<span class="away">away</span>':'');
    el.innerHTML='<div class="stand">'+figureSVG()+
      '<div class="plate"><span class="n">'+esc(s.name)+(s.seat===S.you?" (you)":"")+'</span>'+
      '<span class="c">'+s.count+'</span>'+extra+'</div></div>';
    plane.appendChild(el);
  });

  if(!S.trick.length) onTable={};
  var top=null;
  S.trick.forEach(function(p){ if(p.card.s===S.leadSuit&&(!top||p.card.r>top.card.r)) top=p; });
  S.trick.forEach(function(p){
    var a=seatAngle(p.seat,n,you);
    var isCut=p.card.s!==S.leadSuit;
    var isTop=top&&top.seat===p.seat&&top.card.r===p.card.r&&top.card.s===p.card.s;
    var el=document.createElement("div");
    el.className="tcard"+(REDS[p.card.s]?" red":"")+(isCut?" cut":(isTop?" high":""))+(p.seat===S.you?" mine":"");
    var mine=(p.seat===S.you);
    var r=cardRadius(mine);
    el.dataset.seat=p.seat;
    el.style.left=(50+r.rx*Math.sin(a))+"%";
    el.style.top=(50+r.ry*Math.cos(a))+"%";
    var rot=Math.sin(a)*14+(isCut?-10:0);
    el.style.transform="rotate("+rot.toFixed(1)+"deg)";
    el.innerHTML="<b>"+rl(p.card.r)+GLYPH[p.card.s]+"</b>";
    plane.appendChild(el);
    var ckey=p.seat+":"+p.card.s+p.card.r;
    if(!onTable[ckey]){ onTable[ckey]=1; flyIn(el,a,mine,rot); Snd.flick(); }
  });

  if(!S.trick.length){
    var note=document.createElement("div");
    note.className="tablenote";
    note.textContent=S.over?"Round finished.":(nameOf(S.leader)+" leads.");
    plane.appendChild(note);
  }

  var ev=S.lastEvent;
  var key=ev?ev.type+":"+(ev.eater!==undefined?ev.eater:ev.winner)+":"+ev.n+":"+S.trick.length:null;
  if(key&&key!==shownEvent){
    shownEvent=key;
    if(ev.type==="cut"){ flash("THULLA"); pulse(ev.eater); Snd.thulla(); }
    else Snd.take();
  }
  if(!key) shownEvent=null;

  clearTimeout(flyTimer);
  if(S.resolving&&ev) flyTimer=setTimeout(function(){ flyOut(ev); },1100);

  var outs=(S.finished||[]).length;
  if(outs>prevOut){ Snd.out(); }
  prevOut=outs;

  if(S.phase==="over"&&!overShown) showOver();
  if(S.phase!=="over") overShown=false;
}

function renderTurnBar(){
  var el=$("turnbar");
  if(S.over){
    el.className="turnbar";
    el.innerHTML='<span class="who">Round over</span>';
    return;
  }
  // while a finished trick is held on screen, say what just happened
  if(S.resolving&&S.lastEvent){
    var ev=S.lastEvent;
    el.className="turnbar"+(ev.type==="cut"?" mine":"");
    var who=nameOf(ev.type==="cut"?ev.eater:ev.winner);
    var isYou=(ev.type==="cut"?ev.eater:ev.winner)===S.you;
    var txt = ev.type==="cut"
      ? (isYou?"You pick up "+ev.n:esc(who)+" picks up "+ev.n)
      : (isYou?"You take it":esc(who)+" takes it");
    el.innerHTML='<span class="who">'+(ev.type==="cut"?"Thulla \u2014 ":"")+txt+'</span>';
    return;
  }
  var mine=S.turn===S.you;
  el.className="turnbar"+(mine?" mine":"");
  var label=mine?"Your turn":esc(nameOf(S.turn))+"\u2019s turn";
  var sub="";
  if(mine){
    if(!S.trick.length&&S.firstTrick) sub="lead the Ace of Spades";
    else if(!S.trick.length) sub="your lead, play anything";
    else if((S.legal||[]).length&&S.legal[0].s!==S.leadSuit) sub="no "+SUITNAME[S.leadSuit]+", cut with anything";
    else sub="follow "+GLYPH[S.leadSuit];
  }
  var target=(S.players||[]).find(function(x){return x.seat===S.turn});
  var canNudge = !mine && target && !target.bot && target.connected;
  el.innerHTML='<span class="pip"></span><span class="who">'+label+'</span>'+
               (sub?'<span class="sub">'+sub+'</span>':'')+
               (canNudge?'<button class="nudge" id="nudgeBtn">Nudge</button>':'');
}

function renderHand(){
  var legal=S.legal||[];
  var hand=$("hand"); hand.innerHTML="";
  (S.hand||[]).forEach(function(c){
    var ok=legal.some(function(x){return x.s===c.s&&x.r===c.r});
    var d=document.createElement("div");
    d.className="card"+(REDS[c.s]?" red":"")+(ok?" ok":" no");
    d.innerHTML='<div class="r">'+rl(c.r)+GLYPH[c.s]+'</div><div class="mid">'+GLYPH[c.s]+
                '</div><div class="p">'+rl(c.r)+GLYPH[c.s]+'</div>';
    if(ok){
      d.tabIndex=0; d.setAttribute("role","button");
      d.setAttribute("aria-label",rl(c.r)+" of "+SUITNAME[c.s]);
      var fire=function(){ socket.emit("play",{card:{s:c.s,r:c.r}}); };
      d.addEventListener("click",fire);
      d.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();fire()}});
    }
    hand.appendChild(d);
  });
  var n=(S.hand||[]).length;
  $("myLabel").textContent=nameOf(S.you)+" \u2014 "+n+" card"+(n===1?"":"s");
  $("hint").textContent=hintText();
  runClock();
}

function hintText(){
  if(S.over||S.resolving) return "";
  if(S.turn!==S.you) return "Waiting for "+nameOf(S.turn)+"\u2026";
  if(!S.trick.length&&S.firstTrick) return "Lead the Ace of Spades.";
  if(!S.trick.length) return "Your lead \u2014 play anything.";
  var legal=S.legal||[];
  if(legal.length&&legal[0].s!==S.leadSuit) return "No "+SUITNAME[S.leadSuit]+" \u2014 cut with anything.";
  return "Follow "+GLYPH[S.leadSuit]+".";
}

var clockTimer=null;
function runClock(){
  clearInterval(clockTimer);
  var bar=$("clockBar");
  if(!S.deadline||S.turn!==S.you||S.over||S.resolving){ bar.style.width="0"; return; }
  var total=S.deadline-Date.now();
  var tick=function(){
    var left=S.deadline-Date.now();
    bar.style.width=Math.max(0,Math.min(100,(left/total)*100))+"%";
    if(left<=0) clearInterval(clockTimer);
  };
  tick(); clockTimer=setInterval(tick,300);
}

function drawFeed(id){
  var box=$(id); box.innerHTML="";
  (S.feed||[]).forEach(function(f){
    var d=document.createElement("div");
    if(f.k==="chat"){ d.className="chat"; d.innerHTML="<b>"+esc(f.name)+"</b> "+esc(f.msg); }
    else d.textContent=f.msg;
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}

function showOver(){
  overShown=true; rulesOpen=false;
  var bh=S.bhabhi;
  $("overTitle").textContent = bh===S.you?"You're the Bhabhi":"Round over";
  $("overWho").textContent = (bh===null||bh===undefined)?"Nobody":nameOf(bh);
  $("overSub").textContent = (bh===null||bh===undefined)?"Everyone cleared out at once.":"Left holding the whole mess.";
  var list=$("overList"); list.innerHTML="";
  (S.finished||[]).forEach(function(s,i){
    var li=document.createElement("li"); li.innerHTML="<b>"+esc(nameOf(s))+"</b> \u2014 "+ORD[i]; list.appendChild(li);
  });
  if(bh!==null&&bh!==undefined){var li=document.createElement("li");li.innerHTML="<b>"+esc(nameOf(bh))+"</b> \u2014 Bhabhi";list.appendChild(li);}
  var rows=Object.keys(S.tally||{}).map(function(k){return [k,S.tally[k]]}).filter(function(r){return r[1]>0}).sort(function(a,b){return b[1]-a[1]});
  $("tallyBox").innerHTML=rows.length?("Bhabhi count: "+rows.map(function(r){return esc(r[0])+" "+r[1]}).join(" \u00b7 ")):"";
  $("againBtn").textContent=S.isHost?"Back to lobby":"Close";
  $("over").classList.remove("hidden");
}

$("againBtn").addEventListener("click",function(){
  $("over").classList.add("hidden");
  if(rulesOpen){ rulesOpen=false; return; }
  if(S&&S.isHost&&S.phase==="over") socket.emit("again");
});
$("rulesBtn").addEventListener("click",function(){
  rulesOpen=true;
  $("overTitle").textContent="How Bhabhi works";
  $("overWho").textContent=""; $("overSub").textContent="";
  $("overList").innerHTML=[
    "The whole deck is dealt out. Uneven is fine.",
    "Whoever holds the Ace of Spades must lead it.",
    "Follow the led suit if you hold it.",
    "If everyone follows, the highest card of that suit wins. Those cards leave the game and the winner leads next.",
    "If anyone can't follow, they cut with any card and the trick stops right there \u2014 whoever played the highest card of the led suit picks up the whole pile and leads next.",
    "Empty your hand and you're safe. The last player still holding cards is the Bhabhi."
  ].map(function(t){return "<li>"+t+"</li>"}).join("");
  $("tallyBox").innerHTML=""; $("againBtn").textContent="Close";
  $("over").classList.remove("hidden");
});

function flash(t){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  $("bannerTxt").textContent=t;
  $("banner").classList.remove("hidden");
  setTimeout(function(){$("banner").classList.add("hidden")},1400);
}
function pulse(seat){
  var el=document.querySelector('.seat3d[data-seat="'+seat+'"]');
  if(el){ el.classList.add("eat"); setTimeout(function(){el.classList.remove("eat")},2400); }
}
function nameOf(seat){
  if(seat===null||seat===undefined) return "";
  var s=(S.seats||[]).find(function(x){return x.seat===seat});
  if(s) return s.name;
  var p=(S.players||[]).find(function(x){return x.seat===seat});
  return p?p.name:"";
}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

})();
</script>
